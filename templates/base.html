<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/milligram@1.4.1/dist/milligram.min.css" />
    <style>
      body { margin: 2rem; }
      textarea { min-height: 140px; }
      .entry-card { border: 1px solid #e0e0e0; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
      .meta { color: #666; font-size: 0.9rem; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h2>Chat Archive</h2>
      <nav>
        <a href="/">Add</a>
        <a href="/entries">Entries</a>
        <a href="/document">Document</a>
        <a href="/export.md">Export .md</a>
        <a href="/export.json">Export .json</a>
      </nav>
      <hr />
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </header>
    {% block content %}{% endblock %}
  </body>
  </html>
